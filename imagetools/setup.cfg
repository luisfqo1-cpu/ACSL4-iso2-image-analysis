[metadata]
name = imagetools
version = 0.0.1
description = Image-analysis helpers and a napari plugin for quantifying antibody staining in brain slices
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/luisfqo1-cpu/ACSL4-iso2-image-analysis
author = daniel
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 2 - Pre-Alpha
    Framework :: napari
    Intended Audience :: Science/Research
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Image Processing
project_urls =
    Bug Tracker = https://github.com/luisfqo1-cpu/ACSL4-iso2-image-analysis/issues
    Source Code = https://github.com/luisfqo1-cpu/ACSL4-iso2-image-analysis

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
package_dir =
    =src
install_requires =
    numpy
    scipy
    scikit-image
    pandas
    matplotlib
    tqdm
    shapely
    psutil
    dask

[options.extras_require]
# napari plugin (widgets and .nd2/.npy reader)
napari =
    napari
    magicgui
    qtpy
    opencv-python-headless
    nd2
# cell segmentation used by imagetools.util.return_mask
segmentation =
    cellpose>=2,<4
    stardist
    csbdeep
# atlas matching used by imagetools.util.match_atlas
atlas =
    bg-atlasapi
all =
    imagetools[napari,segmentation,atlas]
testing =
    tox
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pytest-qt  # https://pytest-qt.readthedocs.io/en/latest/
    pyqt5
    imagetools[napari]

[options.packages.find]
where = src

[options.entry_points]
napari.manifest =
    plugin = plugin:napari.yaml

[options.package_data]
* = *.yaml
